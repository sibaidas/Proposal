<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Soniya ❤️</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#ff4b7d,#ff85a2);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
color:white;
overflow:hidden;
}

.card{
background:rgba(255,255,255,.15);
padding:30px;
border-radius:20px;
backdrop-filter:blur(10px);
max-width:350px;
}

img{
width:130px;
height:130px;
border-radius:50%;
border:4px solid white;
object-fit:cover;
margin:10px;
}

button{
padding:12px 25px;
font-size:18px;
border:none;
border-radius:30px;
margin:10px;
cursor:pointer;
}

#yes{background:#00c853;color:white;}
#no{background:#ff1744;color:white;position:relative;}
</style>
</head>

<body>

<div class="card">

<h1>Dear Soniya Nath ❤️</h1>

<img src="photo1.jpg">

<p>
"Every love story is beautiful, but I hope ours becomes my favorite."
</p>

<p>
From the day I met you, life became brighter.
Your smile gives me peace, your kindness inspires me,
and my heart has chosen only one name...
<b>Soniya Nath.</b>
</p>

<h2>Will You Be Mine? 💍</h2>

<button id="yes">Yes ❤️</button>
<button id="no">No 😅</button>

</div>

<script>

let no=document.getElementById("no");

no.addEventListener("mouseover",function(){
this.style.position="absolute";
this.style.left=Math.random()*(window.innerWidth-120)+"px";
this.style.top=Math.random()*(window.innerHeight-60)+"px";
});

document.getElementById("yes").onclick=function(){
document.body.innerHTML="<h1 style='font-family:Arial;color:white;text-align:center;margin-top:40vh;'>❤️ Thank You Soniya ❤️<br>I Promise To Love You Forever 🌹</h1>";
}

</script>

</body>
</html>
