<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Proposal Studio ❤️</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="background"></div>

<div class="container">

<div id="builder">

<h1>❤️ Proposal Studio</h1>

<p class="subtitle">
Create your own proposal website in less than a minute.
</p>

<div class="form">

<input
type="text"
id="yourName"
placeholder="Your Name">

<input
type="text"
id="partnerName"
placeholder="Partner's Name">

<textarea
id="loveLetter"
placeholder="Write your love letter here..."></textarea>

<label>Main Photo</label>

<input
type="file"
id="photo1"
accept="image/*">

<label>Final Photo</label>

<input
type="file"
id="photo2"
accept="image/*">

<button id="generate">

❤️ Create My Proposal ❤️

</button>

</div>

</div>

<div id="proposal" style="display:none;">

<h1 id="title"></h1>

<p class="subtitle">

Every love story is beautiful,<br>
but I hope ours becomes my favorite.

</p>

<img
id="mainPhoto"
class="photo">

<p id="previewLetter" class="message"></p>

<h2>

Will You Be Mine Forever? 💍

</h2>

<div class="buttons">

<button id="yes">

Yes ❤️

</button>

<button id="no">

No 😅

</button>

</div>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
