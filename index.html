<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proposal Studio ❤️</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="builder" class="container">

<h1>❤️ Proposal Studio</h1>

<p>Create your own proposal website in seconds.</p>

<input type="text" id="yourName" placeholder="Your Name">

<input type="text" id="partnerName" placeholder="Partner's Name">

<textarea id="loveLetter" placeholder="Write your love letter..."></textarea>

<label>Main Photo</label>
<input type="file" id="photo1" accept="image/*">

<label>Second Photo</label>
<input type="file" id="photo2" accept="image/*">

<button id="generate">
Create My Proposal ❤️
</button>

</div>

<div id="proposal" style="display:none;">

<div class="container">

<h1 id="title"></h1>

<p class="subtitle">
Every love story is beautiful,<br>
but I hope ours becomes my favorite.
</p>

<img id="mainPhoto" class="photo">

<p id="letter" class="quote"></p>

<h2>Will You Be Mine Forever? 💍</h2>

<button id="yes">Yes ❤️</button>

<button id="no">No 😅</button>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
